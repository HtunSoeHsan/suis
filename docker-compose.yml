services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: suis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-suis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-suispassword}
      POSTGRES_DB: ${POSTGRES_DB:-suis_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-suis} -d ${POSTGRES_DB:-suis_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: suis_backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      PORT: 8001
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-suis}:${POSTGRES_PASSWORD:-suispassword}@postgres:5432/${POSTGRES_DB:-suis_db}
      GROQ_API_KEY: ${GROQ_API_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4001}
      LIVENESS_THRESHOLD: ${LIVENESS_THRESHOLD:-0.6}
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.45}
    volumes:
      - insightface_models:/root/.insightface
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/health" ]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: suis_frontend
    restart: unless-stopped
    ports:
      - "4001:4001"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  insightface_models:
